<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #141414;
  margin: 0;
  padding: 40px;
  font-family: sans-serif;
  color: white;
}

.box {
  width: 400px;
  height: 200px;
  border: 1px solid #333;
  margin: 20px 0;
}

.label {
  font-size: 14px;
  margin-bottom: 8px;
  color: #888;
}

h3 { margin-top: 30px; }

/* White variant - subtle gray waves */
.seigaiha-white {
  background-color: #1a1a1a;
  background-image:
    radial-gradient(circle at 100% 150%, #1a1a1a 24%, #333 24%, #333 28%, #1a1a1a 28%, #1a1a1a 36%, #333 36%, #333 40%, transparent 40%, transparent),
    radial-gradient(circle at 0    150%, #1a1a1a 24%, #333 24%, #333 28%, #1a1a1a 28%, #1a1a1a 36%, #333 36%, #333 40%, transparent 40%, transparent),
    radial-gradient(circle at 50%  100%, #333 10%, #1a1a1a 10%, #1a1a1a 23%, #333 23%, #333 30%, #1a1a1a 30%, #1a1a1a 43%, #333 43%, #333 50%, #1a1a1a 50%, #1a1a1a 63%, #333 63%, #333 71%, transparent 71%, transparent),
    radial-gradient(circle at 100% 50%, #333 5%, #1a1a1a 5%, #1a1a1a 15%, #333 15%, #333 20%, #1a1a1a 20%, #1a1a1a 29%, #333 29%, #333 34%, #1a1a1a 34%, #1a1a1a 44%, #333 44%, #333 49%, transparent 49%, transparent),
    radial-gradient(circle at 0    50%, #333 5%, #1a1a1a 5%, #1a1a1a 15%, #333 15%, #333 20%, #1a1a1a 20%, #1a1a1a 29%, #333 29%, #333 34%, #1a1a1a 34%, #1a1a1a 44%, #333 44%, #333 49%, transparent 49%, transparent);
  background-size: 100px 50px;
}

/* Brick red variant */
.seigaiha-red {
  background-color: #1a1a1a;
  background-image:
    radial-gradient(circle at 100% 150%, #1a1a1a 24%, #aa151b 24%, #aa151b 28%, #1a1a1a 28%, #1a1a1a 36%, #aa151b 36%, #aa151b 40%, transparent 40%, transparent),
    radial-gradient(circle at 0    150%, #1a1a1a 24%, #aa151b 24%, #aa151b 28%, #1a1a1a 28%, #1a1a1a 36%, #aa151b 36%, #aa151b 40%, transparent 40%, transparent),
    radial-gradient(circle at 50%  100%, #aa151b 10%, #1a1a1a 10%, #1a1a1a 23%, #aa151b 23%, #aa151b 30%, #1a1a1a 30%, #1a1a1a 43%, #aa151b 43%, #aa151b 50%, #1a1a1a 50%, #1a1a1a 63%, #aa151b 63%, #aa151b 71%, transparent 71%, transparent),
    radial-gradient(circle at 100% 50%, #aa151b 5%, #1a1a1a 5%, #1a1a1a 15%, #aa151b 15%, #aa151b 20%, #1a1a1a 20%, #1a1a1a 29%, #aa151b 29%, #aa151b 34%, #1a1a1a 34%, #1a1a1a 44%, #aa151b 44%, #aa151b 49%, transparent 49%, transparent),
    radial-gradient(circle at 0    50%, #aa151b 5%, #1a1a1a 5%, #1a1a1a 15%, #aa151b 15%, #aa151b 20%, #1a1a1a 20%, #1a1a1a 29%, #aa151b 29%, #aa151b 34%, #1a1a1a 34%, #1a1a1a 44%, #aa151b 44%, #aa151b 49%, transparent 49%, transparent);
  background-size: 100px 50px;
}
</style>
</head>
<body>
<h2>Seigaiha Pattern - Dark Theme Variants</h2>

<h3>White variant (subtle gray waves)</h3>
<p class="label">For Navbar, StoreDetailModal</p>
<div class="box seigaiha-white"></div>

<h3>Brick red variant</h3>
<p class="label">For AboutSection (pattern-seigaiha-dark)</p>
<div class="box seigaiha-red"></div>

</body>
</html>
